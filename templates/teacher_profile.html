<h2>Teacher Profile</h2>

<form method="POST">

First Name:
<input type="text" value="{{ teacher['first_name'] }}" readonly>
<br><br>

Last Name:
<input type="text" value="{{ teacher['last_name'] }}" readonly>
<br><br>

Email:
<input type="email" name="email" value="{{ teacher['email'] }}">
<br><br>

Phone:
<input type="text" name="phone" value="{{ teacher['phone'] }}">
<br><br>

<button type="submit">Update Profile</button>

</form>

<br>

<a href="/teacher_dashboard">Back to Dashboard</a>
