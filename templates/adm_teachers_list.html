<!DOCTYPE html>
<html>
<head>
    <title>Adminstration Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <!-- Navebar -->
    <div class="navbar bg-dark text-white p-3">
        <h3>Welcome Mr./Ms. {{ session['admin_name'] }}</h3>

        <h3><a href="/logout" class="text-white">Logout</a></h3>
    </div>


<div class="d-flex">
    <!-- Main Content -->
    <div class="main-content p-4">

       <marquee behavior="alternate"><h2 class="mb-3">Registered Teachers</h2></marquee>

        <table border="1" class="table table-bordered table-hover"> 
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Phone</th> 
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
        {% for s in adm_view_teacher %}
            <tr>
                <td>{{ s["tchr_id"] }}</td>
                <td>{{ s["first_name"] }}</td>
                <td>{{ s["last_name"] }}</td>
                <td>{{ s["email"] }}</td>
                <td>{{ s["phone"] }}</td>

                <td>
                    <a href="/adm_edit_teacher/{{ s['tchr_id'] }}" class="btn btn-warning btn-sm">Edit</a>

                    <a href="/delete_teacher/{{ s['tchr_id'] }}"
                    class="btn btn-danger btn-sm"
                    onclick="return confirm('Are you sure you want to delete this student?');">
                    Delete
                    </a>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
    </div>
     <a href="/admin_dashboard">Back to Dashboard</a>
    </div>
    </body>
</html>
