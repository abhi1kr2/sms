<!DOCTYPE html>
<html>
<head>
    <title>Adminstration Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <!-- Navebar -->
    <div class="navbar bg-dark text-white p-3">
        <h3>Welcome Mr./Ms. {{ session['admin_name'] }}</h3>

        <h3><a href="/logout" class="text-white">Logout</a></h3>
    </div>


<div class="d-flex">
    <!-- Main Content -->
    <div class="main-content p-4">

       <marquee behavior="alternate"><h2>Welcome To Admin Portal</h2></marquee>

        <div class="row mt-4">

            <!-- Student Card -->
            <div class="col-md-2">
                <div class="card dashboard-card text-center">
                    <img src="{{ url_for('static', filename='images/icons/student.png') }}" class="icon">
                    <h5>Students</h5>
                    <a href="/admin_register_students" class="btn btn-success">New Registration</a>
                    <a href="/adm_students_list" class="btn btn-warning">View & Modify</a>
                </div>
            </div>
            <div class="col-md-2">
                <div class="card dashboard-card text-center">
                    <img src="{{ url_for('static', filename='images/icons/marks.png') }}" class="icon">
                    <h5>Marksheet</h5>
                    <a href="/admin_register_students" class="btn btn-success">Modify Marks</a>
                    <a href="/adm_students_list" class="btn btn-warning">View Marks</a>
                </div>
            </div>

            <!-- Teacher Card -->
            <div class="col-md-2">
                <div class="card dashboard-card text-center">
                    <img src="{{ url_for('static', filename='images/icons/teacher1.png') }}" class="icon">
                    <h5>Teachers</h5>
                    <a href="/admadd_teacher" class="btn btn-success">New Registration</a>
                    <a href="/admadd_teacher" class="btn btn-warning">View & Modify</a>
                </div>
            </div>

            <!-- Gallery Card -->
            <div class="col-md-2">
                <div class="card dashboard-card text-center">
                    <img src="{{ url_for('static', filename='images/icons/gallery.png') }}" class="icon">
                    <h5>Gallery</h5>
                     <form class="header bg-light" method="post">
                        <input class="form-control" type="file" id="formFile">
                        <input type="submit" value="Upload" class="btn btn-success p-1">
                        <a href="/admadd_teacher" class="btn btn-warning p-1">Modify</a>
                    </form>
                </div>
            </div>

           <!-- School Notice Board --> 
            <div class="col-md-2">
                <div class="card dashboard-card text-center">
                    <img src="{{ url_for('static', filename='images/icons/notice1.png') }}" class="icon">
                    <h5>Notice Board</h5>
                    <a href="#" class="btn btn-success">Add New</a>
                    <a href="#" class="btn btn-warning">View & Modify</a>
                </div>
            </div>

           <!-- Coming Soon --> 
            <div class="col-md-2">
                <div class="card dashboard-card text-center">
                    <img src="{{ url_for('static', filename='images/icons/comsn.png') }}" class="icon">
                    <h5>Coming Soon</h5>
                    <a href="#" class="btn btn-success">Loading</a>
                    <a href="#" class="btn btn-warning">Loading</a>
                </div>
            </div>

        </div>

    </div>

</div>

</body>
</html>
