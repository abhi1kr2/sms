<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnOrbit | Student Panel</title>

    <!-- Bootstrap CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body { overflow-x: hidden; }
    .sidebar {
        width: 240px;
        min-height: 100vh;
    }
    .sidebar a {
        text-decoration: none;
        display: block;
        padding: 10px;
        color: white;
    }
    .sidebar a:hover {
        background: #495057;
    }
</style>

</head>

<body>

    <!-- 🔵 NAVBAR -->

    <nav class="navbar navbar-dark bg-primary px-3 mt-2">
        <span class="text-white">
            Welcome, {{ current_student.first_name if current_student else 'Student' }}
        </span>
        <h3 class="text-white">STUDENT DASHBOARD</h3>

        <div>
            <a href="/" class="btn btn-light btn-sm me-2">Home</a>
            <a href="/stddashboard" class="btn btn-light btn-sm me-2">Dashboard</a>
            <a href="/student_logout" class="btn btn-danger btn-sm">Logout</a>
        </div>
    </nav>

    <div class="d-flex">
        <!-- 🟣 SIDEBAR -->
        <div class="bg-dark sidebar p-3">

            <h5 class="text-white">Student Panel</h5>
            <hr class="text-white">

            <a href="/stddashboard">🏠 Dashboard</a>
            <a href="/stdstudent_profile">👤 Profile</a>
            <a href="/std_view_marks">📊 Marksheet</a>
            <a href="/student_assignments">📚 My Assignment</a>
            <a href="/notices">📢 Notices</a>
            <a href="/student_settings">⚙️ Settings</a>

        </div>
        <!-- 🟢 CONTENT -->
        <div class="p-4 w-100">
            {% block content %}{% endblock %}
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>





    
    <script>

    document.addEventListener("DOMContentLoaded", function () {

        // Remove stuck modal-open class

        document.body.classList.remove("modal-open");

        // Remove all modal backdrops

        document.querySelectorAll(".modal-backdrop").forEach(function(el) {

            el.remove();

        });

        // Restore scrolling

        document.body.style.overflow = "auto";

        document.body.style.paddingRight = "0px";

    });

    </script>



</body>
</html>
