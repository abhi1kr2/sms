<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>

    <!-- Bootstrap CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
   
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body {
            background: url("/static/images/adm_dsh.jpg") center/cover no-repeat fixed;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            backdrop-filter: blur(5px);
            background: rgba(255,255,255,0.7);
            z-index: -1;
        }

    </style>
</head>

<body>

<!-- ================= HEADER ================= -->
<nav class="navbar admin-navbar px-4 d-flex justify-content-between">

    <!-- LEFT SIDE -->
    <div class="d-flex align-items-center gap-3">
        <h5>Admin Panel</h5>

        <!-- HOME BUTTON -->
        <a href="{{ url_for('home') }}" class="btn btn-sm home-btn">
            <i class="bi bi-house-door-fill"></i> Home
        </a>
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-sm home-btn">
            <i class="bi bi-speedometer2"></i> Dashboard
        </a>
    </div>

    <!-- RIGHT SIDE -->
    <div class="d-flex align-items-center gap-3">
        <span>Welcome Mr./Ms. {{ session['admin_name'] }}</span>

        <a href="{{ url_for('logout') }}" class="btn btn-sm logout-btn">
            <i class="bi bi-box-arrow-right"></i> Logout
        </a>
    </div>

</nav>

<!-- ================= CONTENT ================= -->
<div class="container content-area">
    {% block content %}{% endblock %}
</div>




<br><br><br><br><br>
<footer class="text-center text-danger bg-light mt-4 mb-2">
    <small>© 2026 LearnOrbit Admin Panel</small>
</footer>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
