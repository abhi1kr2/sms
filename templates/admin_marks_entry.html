{% extends 'admin_base.html' %}
{% block content %}

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}
{% endwith %}


<div class="container mt-4">
    <h3>Marks Entry</h3>
    <form method="POST" action="/save_marks">
        <!-- Class -->
        <div class="mb-3">
            <label>Class</label>
            <select id="class_id" name="class_id" class="form-control" onchange="loadStudents()">
                <option value="">Select Class</option>
                {% for c in classes %}
                    <option value="{{ c.id }}">{{ c.class_name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Student -->
        <div class="mb-3">
            <label>Student</label>
                <select id="student_id" name="std_id" class="form-control" onchange="loadSubjects()">
                <option value="">Select Student</option>
            </select>
        </div>

        <!-- Exam -->
        <div class="mb-3">
            <label>Exam</label>
            <select id="exam_id" name="exam_id" class="form-control" required>
                <option value="">Select</option>
                {% for e in exams %}
                    <option value="{{ e.id }}">{{ e.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div id="subjects_container" class="mt-3"></div>
        <input type="submit" class="btn btn-danger" value="Save Marks">
    </form>
</div>

{% endblock %}

{% block scripts %}
<script>
function loadStudents() {
    var classId = document.getElementById("class_id").value;
    var dd = document.getElementById("student_id");

    // show immediate feedback
    dd.innerHTML = '<option value="">Loading...</option>';

    if (!classId) {
        dd.innerHTML = '<option value="">Select Student</option>';
        return;
    }

    fetch("/get_students/" + classId)
        .then(function(r){ return r.json(); })
        .then(function(data){
            var html = '<option value="">Select Student</option>';
            data.forEach(function(s){
                html += '<option value="'+s.std_id+'">'
                     +  s.first_name + ' (' + s.reg_id + ')'
                     + '</option>';
            });
            dd.innerHTML = html;
        })
        .catch(function(){
            dd.innerHTML = '<option value="">Error loading</option>';
        });
}

function loadSubjects() {
    var classId = document.getElementById("class_id").value;
    var studentId = document.getElementById("student_id").value;
    var box = document.getElementById("subjects_container");

    box.innerHTML = '';

    // prevent early firing
    if (!classId || !studentId) return;

    box.innerHTML = 'Loading subjects...';

    fetch("/get_subjects/" + classId)
        .then(function(r){ return r.json(); })
        .then(function(data){
            var html = '';
            data.forEach(function(sub){
                html += `
                  <div class="mb-2">
                    <label>${sub.name}</label>
                    <input type="number" name="marks_${sub.id}" class="form-control" min="0" max="100" required>
                  </div>`;
            });
            box.innerHTML = html;
        })
        .catch(function(){
            box.innerHTML = 'Error loading subjects';
        });
}
</script>
{% endblock %}
