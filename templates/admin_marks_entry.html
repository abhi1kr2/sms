{% extends 'admin_base.html' %}
{% block content %}

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}
{% endwith %}


<div class="container mt-4">
    <h3>Marks Entry</h3>
    <form method="POST" action="/save_marks">
        <!-- Class -->
        <div class="mb-3">
            <label>Class</label>
            <select id="class_id" name="class_id" class="form-control" onchange="loadStudents()">
                <option value="">Select Class</option>
                {% for c in classes %}
                    <option value="{{ c.id }}">{{ c.class_name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Exam -->
        <div class="mb-3">
            <label>Exam</label>
            <select id="exam_id" name="exam_id"  class="form-control" required onchange="loadSubjects()">
                <option value="">Select</option>
                {% for e in exams %}
                    <option value="{{ e.id }}">{{ e.name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Student -->
        <div class="mb-3">
            <label>Student</label>
                <select id="student_id" name="std_id" class="form-control" onchange="loadSubjects()">
                <option value="">Select Student</option>
            </select>
        </div>
        <div class="mb-3">
            <div id="result_preview" class="mt-3"></div>
        </div>

        <div id="subjects_container" class="mt-3"></div>
        <input type="submit" id="saveBtn" class="btn btn-danger" value="Save Marks" disabled>
    </form>
</div>

{% endblock %}

{% block scripts %}
<script>

function loadStudents() {
    var classId = document.getElementById("class_id").value;
    var dd = document.getElementById("student_id");

    // show immediate feedback
    dd.innerHTML = '<option value="">Loading...</option>';

    if (!classId) {
        dd.innerHTML = '<option value="">Select Student</option>';
        return;
    }

    fetch("/get_students/" + classId)
        .then(function(r){ return r.json(); })
        .then(function(data){
            var html = '<option value="">Select Student</option>';
            data.forEach(function(s){
                html += '<option value="'+s.std_id+'">'
                     +  s.first_name + ' (' + s.reg_id + ')'
                     + '</option>';
            });
            dd.innerHTML = html;
        })
        .catch(function(){
            dd.innerHTML = '<option value="">Error loading</option>';
        });
}

function loadSubjects() {

    let classId = document.getElementById("class_id").value;
    let studentId = document.getElementById("student_id").value;
    let examId = document.getElementById("exam_id").value;
    let container = document.getElementById("subjects_container");

    container.innerHTML = "Loading...";

    if (!classId || !studentId || !examId) {
        container.innerHTML = "";
        return;
    }

    // 1️⃣ Load subjects
    fetch("/get_subjects/" + classId)
        .then(res => res.json())
        .then(subjects => {

            // 2️⃣ Load existing marks
            fetch("/get_marks/" + studentId + "/" + examId)
                .then(res => res.json())
                .then(existing => {

                    let marksMap = {};
                    existing.forEach(m => {
                        marksMap[m.subject_id] = m.marks_obtained;
                    });

                    let html = "";

                    subjects.forEach(sub => {

                        //let value = marksMap[sub.id] || "";
                        let value = (marksMap[sub.id] !== undefined) ? marksMap[sub.id] : "";

                        html += `
                            <div class="mb-2">
                                <label>${sub.name}</label>
                                <input type="number"
                                    name="marks_${sub.id}"
                                    class="form-control"
                                    min="0" max="100"
                                    value="${value}"
                                    oninput="calculateTotal()">
                            </div>
                        `;
                    });
                    let isEdit = existing.length > 0;

                    let modeText = isEdit 
                        ? '<div class="alert alert-warning">Editing Existing Marks</div>' 
                        : '<div class="alert alert-info">New Marks Entry</div>';

                    container.innerHTML = modeText + html;
                    //container.innerHTML = html;

                });

        });
}


function checkReady() {
    let c = document.getElementById("class_id").value;
    let s = document.getElementById("student_id").value;
    let e = document.getElementById("exam_id").value;

    document.getElementById("saveBtn").disabled = !(c && s && e);
}

document.getElementById("class_id").addEventListener("change", checkReady);
document.getElementById("student_id").addEventListener("change", checkReady);
document.getElementById("exam_id").addEventListener("change", checkReady);





// =====================
// TOTAL + % CALCULATION
// =====================
function calculateTotal() {

    let inputs = document.querySelectorAll("#subjects_container input");
    let total = 0;
    let count = 0;

    inputs.forEach(inp => {
        let val = parseInt(inp.value);

        if (!isNaN(val)) {
            total += val;
            count++;

            // Highlight fail
            if (val < 33) {
                inp.style.border = "2px solid red";
            } else {
                inp.style.border = "";
            }
        }
    });

    let percent = count ? (total / (count * 100)) * 100 : 0;

    let resultDiv = document.getElementById("result_preview");

    if (resultDiv) {
        resultDiv.innerHTML = `
            <div class="alert alert-info">
                Total: ${total} | Percentage: ${percent.toFixed(2)}%
            </div>
        `;
    }
}


// =====================
// EVENT LISTENER (IMPORTANT)
// =====================
document.addEventListener("input", function(e) {

    // Debug line (remove later)
    console.log("Input detected");

    if (e.target.closest("#subjects_container")) {
        calculateTotal();
    }
});



</script>
{% endblock %}
