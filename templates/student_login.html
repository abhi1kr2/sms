{% extends "base.html" %}

{% block title %}Student Login | LearnOrbit School{% endblock %}
{% block content %}
  <!-- Overlay school name -->
  <h1 class="text-primary bg-white fw-bold position-absolute start-50 translate-middle-x mt-2">
    LearnOrbit School
  </h1>

<div class="row text-center d-flex align-items-center justify-content-center vh-100" 
     style="background: url('{{ url_for('static', filename='images/c4.jpg') }}') no-repeat center center; background-size: cover;">

  <div class="col-md-6 col-lg-4 justify-content-center">
    <div class="card shadow-lg" style="background: rgba(243, 243, 232, 0.423); border: none;">
      <div class="card-body text-center text-white">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="LearnOrbit Logo" class="" style="width:200px;">
        <h2 class="mb-4 text-white fw-bold">Student Login</h2>

        <form method="POST" action="{{ url_for('student_login') }}">
          <div class="mb-3">
            <input type="text" class="form-control" name="semail" placeholder="Enter Student ID" required>
          </div>
          <div class="mb-3">
            <input type="password" class="form-control" name="spassword" placeholder="Enter Password" required>
          </div>
          <button type="submit" class="btn btn-warning w-100 fw-bold">Login</button>
        </form>

        <div class="mt-3">
          <a href="{{ url_for('std_forgot_password') }}" class="text-danger text-decoration-none">Forgot Password?</a>
        </div>

        <!-- Back to Home -->
        <div class="mt-3">
          <a href="{{ url_for('home') }}" class="btn btn-outline-primary w-100">Back to Home</a>
        </div>
    
        <!-- Error message -->
        {% if error %}
          <div class="alert alert-danger alert-dismissible fade show" role="alert">
            {{ error }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endif %}

      </div>
    </div>
  </div>
</div>

{% endblock %}
