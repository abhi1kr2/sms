{% extends 'student_base.html' %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow-lg p-4 rounded-4">

        <h3 class="mb-3">👤 My Profile</h3>

        {% if message %}
        <div class="alert alert-success">{{ message }}</div>
        {% endif %}

        <form method="POST">

            <!-- BASIC INFO -->
            <div class="mb-4">
                <h5 class="text-primary">Basic Information</h5>
                <hr>

                <div class="row g-3">
                    <div class="col-md-2">
                        <label>Registration No</label>
                        <input class="form-control text-success" value="{{ student.reg_id }}" readonly>
                    </div>

                    <div class="col-md-5">
                        <label>First Name</label>
                        <input class="form-control" value="{{ student.first_name }}" readonly>
                    </div>

                    <div class="col-md-5">
                        <label>Last Name</label>
                        <input class="form-control" value="{{ student.last_name }}" readonly>
                    </div>

                    <div class="col-md-6">
                        <label>Date of Birth</label>
                        <input class="form-control" value="{{ student.std_dob }}" readonly>
                    </div>
                    <div class="col-md-6">
                        <label>Date of Admission</label>
                        <input class="form-control" value="{{ student.admission_date }}" readonly>
                    </div>
                </div>
            </div>

            <!-- CONTACT INFO -->
            <div class="mb-4">
                <h5 class="text-success">Contact Information</h5>
                <hr>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label>Email</label>
                        <input type="email" name="email"
                            value="{{ student.email }}"
                            class="form-control"  maxlength="60" required>
                    </div>

                    <div class="col-md-6">
                        <label>Phone</label>
                        <input type="tel" name="sphno"
                            value="{{ student.phone }}"
                            class="form-control" maxlength="10" required>
                    </div>

                    <div class="row col-12 mt-4">
                        
                        <div class="col-md-6">
                            <label>Address</label>
                            <input type="text" name="address" value="{{ student.address }}" class="form-control"> 
                        </div>
                        <div class="col-md-3">
                            <label>State</label>
                            <input type="text" name="state" value="{{ student.state }}" class="form-control" pattern="^[A-Za-z]+(?:[ '-][A-Za-z]+)*$" minlength="4" maxlength="4" placeholder="State Name* " required> 
                        </div>
                        <div class="col-md-3">
                            <label>Pincode</label>
                            <input type="text" name="pincode" value="{{ student.pincode }}" class="form-control" pattern="[0-9]{6}" minlength="6" maxlength="6" placeholder="6 digit Pincode* " required> 
                        </div>
                    </div>
                </div>
            </div>

            <!-- PARENT INFO (READ ONLY) -->
            <div class="mb-4">
                <h5 class="text-warning">Parent Information</h5>
                <hr>

                <div class="row g-3">
                    <div class="col-md-4">
                        <label>Father Name</label>
                        <input class="form-control" value="{{ student.father_name }}" readonly>
                    </div>

                    <div class="col-md-4">
                        <label>Mother Name</label>
                        <input class="form-control" value="{{ student.mother_name }}" readonly>
                    </div>
                    <div class="col-md-4">
                        <label>Phone Number</label>
                        <input class="form-control" value="{{ student.parent_phone }}" readonly>
                    </div>
                </div>
            </div>

            <!-- BUTTON -->
            <div class="text-end">
                <button class="btn btn-primary px-4">Update Profile</button>
            </div>

        </form>

    </div>

</div>

{% endblock %}
