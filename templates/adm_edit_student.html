<h2>Edit Student</h2>

<form method="POST">

First Name:
<input type="text" name="fname" value="{{ student[1] }}"><br><br>

Last Name:
<input type="text" name="lname" value="{{ student[2] }}"><br><br>

Email:
<input type="email" name="email" value="{{ student[3] }}"><br><br>

Phone:
<input type="text" name="phone" value="{{ student[4] }}"><br><br>

<button type="submit">Update Student</button>

</form>
