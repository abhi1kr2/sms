<h2>Registered Students</h2>

<table border="1" cellpadding="10">
<tr>
    <th>ID</th>
    <th>First Name</th>
    <th>Last Name</th>
    <th>Email</th>
    <th>Phone</th> 
    <th>Action</th>
</tr>

{% for s in adm_view_students %}

<tr>
    <td>{{ s[0] }}</td>
    <td>{{ s[1] }}</td>
    <td>{{ s[2] }}</td>
    <td>{{ s[3] }}</td>
    <td>{{ s[4] }}</td>


    <td>
        <a href="/adm_edit_student/{{ s[0] }}">Edit</a> |
        <a href="/delete_student/{{ s[0] }}">Delete</a>
    </td>

</tr>


{% endfor %}

</table>
