{% extends 'admin_base.html' %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow-lg p-4 rounded-4">

        <h3 class="mb-4">👨‍🏫 Register Teacher</h3>

        {% if message %}
        <div class="alert alert-{{ msg_type }}">
            {{ message }}
        </div>
        {% endif %}

        <form method="POST"
            enctype="multipart/form-data"
            autocomplete="off">

            <div class="row g-3">

                <!-- First Name -->
                <div class="col-md-6">
                    <label class="form-label">First Name</label>

                    <input type="text"
                        name="first_name"
                        class="form-control"
                        maxlength="20"
                        required>
                </div>

                <!-- Last Name -->
                <div class="col-md-6">
                    <label class="form-label">Last Name</label>

                    <input type="text"
                        name="last_name"
                        class="form-control"
                        maxlength="20"
                        required>
                </div>

                <!-- DOB -->
                <div class="col-md-6">
                    <label class="form-label">Date of Birth</label>

                    <input type="date"
                        name="tchr_dob"
                        class="form-control"
                        min="1980-01-01"
                        max="2020-01-01"
                        required>
                </div>

                <!-- Email -->
                <div class="col-md-6">
                    <label class="form-label">Email</label>

                    <input type="email"
                        name="email"
                        class="form-control"
                        maxlength="50"
                        required>
                </div>

                <!-- Phone -->
                <div class="col-md-6">
                    <label class="form-label">Phone</label>

                    <input type="text"
                        name="phone"
                        class="form-control"
                        pattern="[0-9]{10}"
                        minlength="10"
                        maxlength="10"
                        required>

                    <small class="text-muted">
                        Enter 10 digit mobile number
                    </small>
                </div>

                <!-- Assigned Class -->
                <div class="col-md-6">

                    <label class="form-label">Assigned Class</label>

                    <select name="class_id"
                            class="form-select"
                            required>

                        <option value="">
                            Select Class
                        </option>

                        {% for c in classes %}
                        <option value="{{ c.id }}">
                            {{ c.class_name }}
                        </option>
                        {% endfor %}

                    </select>

                </div>

                <!-- Multiple Subjects -->
                <div class="col-md-6">
                    <label class="form-label">Subjects</label>

                    <select name="subjects"
                            class="form-select"
                            multiple
                            required>

                        {% for s in subjects %}
                        <option value="{{ s.name }}">
                            {{ s.name }}
                        </option>
                        {% endfor %}

                    </select>

                    <small class="text-muted">
                        Hold Ctrl to select multiple subjects
                    </small>
                </div>

                <!-- Password -->
                <div class="col-md-6">

                    <label class="form-label">Password</label>

                    <input type="text"
                        name="teacher_password"
                        class="form-control"
                        maxlength="20"
                        placeholder="Leave blank for auto password">

                    <small class="text-muted">
                        Default: firstname@last4digits
                    </small>

                </div>

                <!-- Teacher Photo -->
                <div class="col-md-6">

                    <label class="form-label">Teacher Photo</label>

                    <input type="file"
                        name="tchr_img"
                        class="form-control"
                        accept=".jpg,.jpeg,.png">

                    <small class="text-muted">
                        Allowed: JPG, JPEG, PNG | Max Size: 1MB
                    </small>

                </div>

            </div>

            <!-- Buttons -->
            <div class="mt-4 text-end">

                <button type="submit"
                        class="btn btn-success px-4">
                    Register Teacher
                </button>

                <button type="reset"
                        class="btn btn-danger px-4">
                    Clear Data
                </button>

            </div>

        </form>

    </div>
</div>

{% endblock %}
